name: Debug site déployé — vrai navigateur (contournement sandbox)

# Le sandbox Claude Code interactif ne peut pas atteindre le domaine
# Vercel (proxy réseau bloqué, cf. docs/OPERATIONS.md). Ce workflow charge
# la VRAIE page déployée avec un vrai Chromium sur un runner GitHub
# Actions (accès réseau normal) — demandé explicitement par l'utilisateur
# pour vérifier ce qui s'affiche réellement, plutôt qu'une reconstruction
# locale avec des données mockées.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL complète à charger"
        required: true
        default: "https://f1platform.vercel.app/courses/14"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install playwright@^1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/debug_live_site_check.mjs --url "${{ inputs.url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-screenshots
          path: live_*.png
          retention-days: 7

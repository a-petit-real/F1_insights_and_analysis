name: Fetch URL (contournement sandbox — lecture seule, sans secret)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL à récupérer (bloquée depuis le sandbox interactif : formula1.com, press.pirelli.com, api.openf1.org, wikipedia, ...)"
        required: true
      raw:
        description: "Corps brut sans extraction de texte (utile pour du JSON d'API)"
        type: boolean
        default: false
      selector:
        description: "Sélecteur CSS optionnel pour restreindre l'extraction (ex: article)"
        required: false
      max_chars:
        description: "Troncature de la sortie (caractères)"
        default: "25000"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: >
          python scripts/fetch_url.py
          --url "${{ inputs.url }}"
          ${{ inputs.raw == 'true' && '--raw' || '' }}
          ${{ inputs.selector != '' && format('--selector "{0}"', inputs.selector) || '' }}
          --max-chars "${{ inputs.max_chars }}"

name: Ingestion OpenF1 (temps au tour, pneus, météo, messages de course)

on:
  workflow_dispatch:
    inputs:
      season:
        default: "2026"
      rounds:
        description: "Rounds à ingérer, séparés par des espaces (vide = toutes les courses déjà disputées)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: >
          python scripts/ingest_openf1.py
          --season "${{ inputs.season }}"
          ${{ inputs.rounds != '' && format('--rounds {0}', inputs.rounds) || '' }}

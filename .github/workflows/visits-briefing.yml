name: Récap fréquentation du site (lecture seule)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Fenêtre glissante en heures"
        default: "24"
      since:
        description: "Date ISO (YYYY-MM-DD) — remplace 'hours' si renseigné"
        required: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: >
          python scripts/visits_briefing.py
          --hours "${{ inputs.hours }}"
          ${{ inputs.since != '' && format('--since {0}', inputs.since) || '' }}

name: Debug position par tour (contournement sandbox — lecture DB)

# Valide scripts/debug_position_check.py contre la vraie base : reproduit
# la logique de classement par session_time utilisée côté client
# (RawDataTab, graphique "Position par tour") et la compare à
# results.finish_position. Le sandbox interactif n'a pas d'accès réseau
# à la base — ce job tourne à la place, avec le secret DATABASE_URL.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Saison"
        default: "2026"
      round:
        description: "Round"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: >
          python scripts/debug_position_check.py
          --season "${{ inputs.season }}"
          --round "${{ inputs.round }}"

name: Ingestion OpenF1 — télémétrie vitesse/distance par tour

# car_data pèse plusieurs Mo par pilote (contrairement aux autres endpoints
# OpenF1 déjà ingérés) : un round à la fois, déclenchement manuel après
# chaque course — cf. docs/OPERATIONS.md et le docstring de
# scripts/ingest_openf1_telemetry.py.

on:
  workflow_dispatch:
    inputs:
      season:
        default: "2026"
      round:
        description: "Round à ingérer"
        required: true
      session:
        description: "Séance OpenF1 — 'Race' écrit dans lap_telemetry (comportement historique), toute autre valeur dans practice_telemetry"
        default: "Race"
        type: choice
        options:
          - "Race"
          - "Practice 1"
          - "Practice 2"
          - "Practice 3"
          - "Qualifying"
          - "Sprint Qualifying"
          - "Sprint"
      cars:
        description: "Numéros de voiture séparés par des virgules (ex. '4,12') — vide = toutes. Réserver le vide à la course ; restreindre pour un duel qualif ciblé."
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Apply schema (idempotent)
        run: psql "$DATABASE_URL" -f db/schema_fastf1.sql
      - run: >
          python -u scripts/ingest_openf1_telemetry.py
          --season "${{ inputs.season }}"
          --round "${{ inputs.round }}"
          --session "${{ inputs.session }}"
          ${{ inputs.cars != '' && format('--cars {0}', inputs.cars) || '' }}

name: Ingestion OpenF1 — télémétrie vitesse/distance par tour

# car_data pèse plusieurs Mo par pilote (contrairement aux autres endpoints
# OpenF1 déjà ingérés) : un round à la fois, déclenchement manuel après
# chaque course — cf. docs/OPERATIONS.md et le docstring de
# scripts/ingest_openf1_telemetry.py.

on:
  workflow_dispatch:
    inputs:
      season:
        default: "2026"
      round:
        description: "Round à ingérer"
        required: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Apply schema (idempotent)
        run: psql "$DATABASE_URL" -f db/schema_fastf1.sql
      - run: >
          python scripts/ingest_openf1_telemetry.py
          --season "${{ inputs.season }}"
          --round "${{ inputs.round }}"

name: Debug télémétrie vitesse/distance (contournement sandbox — lecture DB)

on:
  workflow_dispatch:
    inputs:
      season:
        default: "2026"
      round:
        description: "Round"
        required: true
      lap:
        description: "Tour à inspecter"
        default: "10"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: >
          python scripts/debug_telemetry_check.py
          --season "${{ inputs.season }}"
          --round "${{ inputs.round }}"
          --lap "${{ inputs.lap }}"
